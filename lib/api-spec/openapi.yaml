openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: drive
    description: Google Drive operations
  - name: pricetag
    description: Price-tag rendering operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /pricetag/render:
    post:
      operationId: renderPriceTag
      tags: [pricetag]
      summary: Render a single price tag as a JPEG
      description: >
        Renders the same HTML/CSS the mobile PDF export uses through a
        headless Chromium and returns the resulting JPEG bytes (base64
        encoded). Use this instead of capturing a React Native view to
        get pixel-perfect output that matches the PDF.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceTagRenderInput"
      responses:
        "200":
          description: Rendered JPEG
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceTagRenderResult"
  /drive/upload:
    post:
      operationId: uploadDriveFile
      tags: [drive]
      summary: Upload a file to Google Drive
      description: >
        Uploads a base64-encoded file to the connected Google Drive. When
        `folderName` is provided, the file is placed in that folder
        (created on demand at Drive root if missing).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriveUploadInput"
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriveUploadResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PriceTagItem:
      type: object
      required: [itemNo, description, mrp, promotionPrice, sp]
      properties:
        itemNo: { type: string }
        description: { type: string }
        mrp: { type: ["string", "number"] }
        promotionPrice: { type: ["string", "number"] }
        sp: { type: ["string", "number"] }
        eligibleQty: { type: ["string", "number"] }
        promoSortCode: { type: string }
        imageUri:
          type: string
          description: >
            Image source for the tag. Accepts a `data:` URI (recommended
            for reliability — the server doesn't fetch external URLs) or
            an absolute http(s) URL Chromium can load.
        promotionToDate: { type: string }
        customTitle:
          type: string
          description: Banner title used when style="E".
        style:
          $ref: "#/components/schemas/PriceTagStyle"
    PriceTagStyle:
      type: string
      enum: [A, B, C, D, E]
    TagColors:
      type: object
      required: [red, deepRed, cream, gold]
      description: >
        Customizable brand palette used by Style A/B/C/D/E pricetags
        (and the SQ showcase). All values are CSS hex strings
        (`#RRGGBB`).
      properties:
        red:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        deepRed:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        cream:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        gold:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
    PriceTagRenderInput:
      type: object
      required: [item, style, showLogo]
      properties:
        item:
          $ref: "#/components/schemas/PriceTagItem"
        style:
          $ref: "#/components/schemas/PriceTagStyle"
        showLogo:
          type: boolean
          description: Whether to overlay the Sathyam Super Store watermark logo.
        widthPx:
          type: integer
          minimum: 200
          maximum: 1200
          description: >
            Natural CSS body width in pixels (default 380, mirrors the
            PDF grid column). Output JPEG width = widthPx × scale.
        scale:
          type: number
          minimum: 1
          maximum: 6
          description: >
            Device scale factor used by Chromium (default 4). Higher =
            crisper output but slower / larger file.
        colors:
          $ref: "#/components/schemas/TagColors"
        aspect:
          type: string
          enum: [banner, square]
          description: >
            Output aspect ratio. `banner` (default) uses the existing
            tight-clipped tag layout (~2:1). `square` renders the
            dedicated Instagram-friendly 1:1 showcase template
            (`buildSquareShowcaseHtml`) and clips to widthPx × widthPx.
    PriceTagRenderResult:
      type: object
      required: [base64, mimeType, widthPx, heightPx]
      properties:
        base64:
          type: string
          description: JPEG bytes, base64-encoded (no data URI prefix).
        mimeType:
          type: string
          enum: [image/jpeg]
        widthPx:
          type: integer
          description: Final output width in pixels.
        heightPx:
          type: integer
          description: Final output height in pixels.
    DriveUploadInput:
      type: object
      required: [filename, mimeType, dataBase64]
      properties:
        filename:
          type: string
          minLength: 1
          description: File name as it should appear in Google Drive.
        mimeType:
          type: string
          minLength: 1
          description: Mime type of the uploaded bytes (e.g. image/png).
        dataBase64:
          type: string
          minLength: 1
          description: Base64-encoded file contents.
        folderName:
          type: string
          description: >
            Optional Drive folder name. The folder is looked up by name at
            Drive root and created if missing.
    DriveUploadResult:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        webViewLink:
          type: ["string", "null"]
        folderId:
          type: ["string", "null"]

